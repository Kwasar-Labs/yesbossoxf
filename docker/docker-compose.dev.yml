# YesBoss Backend - Docker Compose (Development)
# Usage: docker compose -f docker-compose.dev.yml up
#
# Mounts source code for hot-reload via tsx --watch

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: yesboss
      MONGO_INITDB_ROOT_PASSWORD: devpassword
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yesboss-dev

  auth:
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    command: ["npx", "tsx", "--watch", "apps/auth/src/index.ts"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      AUTH_PORT: 3001
      MONGO_URI: mongodb://yesboss:devpassword@mongo:27017/yesboss?authSource=admin
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      YESBOSS_API_KEY: dev-api-key
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ../keys:/app/keys:ro
      - ../apps/auth/src:/app/apps/auth/src:ro
      - ../packages:/app/packages:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - yesboss-dev

  workforce:
    build:
      context: ..
      dockerfile: docker/workforce.Dockerfile
    command: ["npx", "tsx", "--watch", "apps/workforce/src/index.ts"]
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      WORKFORCE_PORT: 3002
      MONGO_URI: mongodb://yesboss:devpassword@mongo:27017/yesboss?authSource=admin
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      YESBOSS_API_KEY: dev-api-key
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ../keys:/app/keys:ro
      - ../apps/workforce/src:/app/apps/workforce/src:ro
      - ../packages:/app/packages:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - yesboss-dev

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    command: ["npx", "tsx", "--watch", "apps/dev-gateway/src/index.ts"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GATEWAY_PORT: 3000
      AUTH_PORT: 3001
      WORKFORCE_PORT: 3002
    volumes:
      - ../apps/dev-gateway/src:/app/apps/dev-gateway/src:ro
    depends_on:
      - auth
      - workforce
    networks:
      - yesboss-dev

  # ---- Communication Service (Dev) ----
  communication:
    build:
      context: ..
      dockerfile: docker/communication.Dockerfile
    command: ["npx", "tsx", "--watch", "apps/communication/src/index.ts"]
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      COMMUNICATION_PORT: 4000
      MONGO_URI: mongodb://yesboss:devpassword@mongo:27017/yesboss?authSource=admin
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      YESBOSS_API_KEY: dev-api-key
      AUTH_SERVICE_URL: http://auth:3001
      WORKFORCE_SERVICE_URL: http://workforce:3002
      OPENCLAW_GATEWAY_URL: http://host.docker.internal:18790
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-0230b8c7ee27846992bb9fc068db3e0b0441bcd061d9f65b}
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ../keys:/app/keys:ro
      - ../apps/communication/src:/app/apps/communication/src:ro
      - ../packages:/app/packages:ro
    depends_on:
      mongo:
        condition: service_healthy
      auth:
        condition: service_healthy
      workforce:
        condition: service_healthy
    networks:
      - yesboss-dev

  # ---- Web Frontend (Dev) ----
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    command: ["npx", "next", "dev", "-p", "3000"]
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_OPENCLAW_URL: http://localhost:4000
    volumes:
      - ../apps/web/src:/app/apps/web/src:ro
      - ../packages/types/src:/app/packages/types/src:ro
    depends_on:
      - gateway
    networks:
      - yesboss-dev

volumes:
  mongo_dev_data:

networks:
  yesboss-dev:
    driver: bridge
